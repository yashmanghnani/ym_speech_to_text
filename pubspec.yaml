name: ym_speech_to_text
description: A Flutter plugin that exposes device specific speech to text recognition capability.
version: 0.0.3
homepage: https://github.com/yashmanghnani/ym_speech_to_text

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.29.3"

dependencies:
  flutter:
    sdk: flutter
  speech_to_text_platform_interface: ^2.4.0
  json_annotation: ^4.12.0
  clock: ^1.1.2
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.19.0
  web: ^1.1.1
  speech_to_text_windows: ^1.0.1

dev_dependencies:
  build_runner: ^2.16.0
  json_serializable: ^6.14.1
  fake_async: ^1.3.3
  mockito: ^5.8.1
  plugin_platform_interface: ^2.1.8
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.csdcorp.speech_to_text
        pluginClass: SpeechToTextPlugin
      ios:
        pluginClass: SpeechToTextPlugin
        sharedDarwinSource: true
      web:
        pluginClass: SpeechToTextPlugin
        fileName: speech_to_text_web.dart
      macos:
        pluginClass: SpeechToTextPlugin
        sharedDarwinSource: true
      windows:
        default_package: speech_to_text_windows
      linux:
        pluginClass: SpeechToTextPlugin
